{
  "schema_version": 1,
  "id": 7,
  "title": "Validation, Preconditions, Checks, and Tests",
  "type": "terraform-test",
  "tier": "quality",
  "difficulty": "medium",
  "estimated_minutes": 20,
  "execution": {
    "mode": "local",
    "terraform_version": ">= 1.6, < 2.0",
    "requires_cloud_credentials": false,
    "creates_billable_resources": false,
    "backend": "local"
  },
  "validation": {
    "starter_expected_result": "fail",
    "expected_failure_stage": "test",
    "expected_error_category": "behavior",
    "expected_failing_test": "tests/public.tftest.hcl",
    "expected_failure_marker": "EXPECTED_GUARDS_INCOMPLETE",
    "solution_expected_result": "pass",
    "commands": [
      {
        "name": "format",
        "stage": "format",
        "argv": ["terraform", "fmt", "-check", "-recursive"]
      },
      {
        "name": "init",
        "stage": "init",
        "argv": ["terraform", "init", "-backend=false", "-input=false"]
      },
      {
        "name": "validate",
        "stage": "validate",
        "argv": ["terraform", "validate"]
      },
      {
        "name": "terraform test",
        "stage": "test",
        "argv": ["{python}", "../scripts/verify_tests.py"]
      }
    ]
  },
  "editable_paths": ["starter/main.tf"],
  "protected_paths": ["lab.yaml", "starter/versions.tf", "tests/public.tftest.hcl", "scripts/verify_tests.py"]
}
