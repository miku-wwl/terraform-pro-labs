{
  "schema_version": 1,
  "id": 1,
  "title": "Terraform CLI and prevent_destroy",
  "type": "authoring-local",
  "tier": "core-authoring",
  "difficulty": "easy",
  "estimated_minutes": 10,
  "execution": {
    "mode": "local",
    "terraform_version": ">= 1.6, < 2.0",
    "requires_cloud_credentials": false,
    "creates_billable_resources": false,
    "backend": "local"
  },
  "validation": {
    "starter_expected_result": "fail",
    "expected_failure_stage": "test",
    "expected_error_category": "behavior",
    "expected_failing_test": "scripts/verify_prevent_destroy.py",
    "expected_failure_marker": "EXPECTED_GUARD_MISSING",
    "solution_expected_result": "pass",
    "commands": [
      {
        "name": "format",
        "stage": "format",
        "argv": ["terraform", "fmt", "-check", "-recursive"]
      },
      {
        "name": "init",
        "stage": "init",
        "argv": ["terraform", "init", "-backend=false", "-input=false"]
      },
      {
        "name": "validate",
        "stage": "validate",
        "argv": ["terraform", "validate"]
      },
      {
        "name": "prevent_destroy behavior",
        "stage": "test",
        "argv": ["{python}", "../scripts/verify_prevent_destroy.py"]
      }
    ]
  },
  "editable_paths": ["starter/main.tf"],
  "protected_paths": ["lab.yaml", "starter/versions.tf", "scripts/verify_prevent_destroy.py"]
}
