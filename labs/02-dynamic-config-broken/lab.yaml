{
  "schema_version": 1,
  "id": 2,
  "title": "Dynamic Configuration with Stable Iteration",
  "type": "authoring-local",
  "tier": "core-authoring",
  "difficulty": "medium",
  "estimated_minutes": 25,
  "execution": {
    "mode": "local",
    "terraform_version": ">= 1.6, < 2.0",
    "requires_cloud_credentials": false,
    "creates_billable_resources": false,
