  },
  "validation": {
    "starter_expected_result": "fail",
    "expected_failure_stage": "test",
    "expected_error_category": "behavior",
    "expected_failing_test": "tests/public.tftest.hcl",
    "expected_failure_marker": "EXPECTED_DYNAMIC_CONFIGURATION_INCOMPLETE",
    "solution_expected_result": "pass",
    "commands": [
      {"name": "format", "stage": "format", "argv": ["terraform", "fmt", "-check", "-recursive"]},
      {"name": "init", "stage": "init", "argv": ["terraform", "init", "-backend=false", "-input=false"]},
      {"name": "validate", "stage": "validate", "argv": ["terraform", "validate"]},
      {"name": "terraform test", "stage": "test", "argv": ["{python}", "../scripts/verify_tests.py"]}
    ]
  },
  "editable_paths": ["starter/main.tf"],
  "protected_paths": ["lab.yaml", "starter/versions.tf", "tests/public.tftest.hcl", "scripts/verify_tests.py"]
