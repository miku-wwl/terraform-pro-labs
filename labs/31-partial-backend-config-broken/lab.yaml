{
  "schema_version": 1,
  "id": 31,
  "title": "Partial S3 Backend Configuration",
  "type": "backend-remote-state",
  "tier": "operations-state",
  "difficulty": "medium",
  "estimated_minutes": 20,
  "execution": {
    "mode": "local-static",
    "terraform_version": ">= 1.10, < 2.0",
    "requires_cloud_credentials": false,
    "creates_billable_resources": false,
    "backend": "s3-partial-offline"
  },
  "validation": {
    "starter_expected_result": "fail",
    "expected_failure_stage": "test",
    "expected_error_category": "partial-backend-boundary",
    "expected_failing_test": "scripts/verify_backend.py",
    "expected_failure_marker": "EXPECTED_PARTIAL_BACKEND_INCOMPLETE",
    "solution_expected_result": "pass",
    "commands": [
      {
        "name": "format",
        "stage": "format",
        "argv": ["terraform", "fmt", "-check", "-recursive"]
      },
      {
        "name": "offline init",
        "stage": "init",
        "argv": ["terraform", "init", "-backend=false", "-input=false"]
      },
      {
        "name": "validate",
        "stage": "validate",
        "argv": ["terraform", "validate"]
      },
      {
        "name": "partial backend behavior",
        "stage": "test",
        "argv": [
          "{python}",
          "../scripts/verify_backend.py",
          "--starter",
          ".",
          "--examples",
          ".."
        ]
      }
    ]
  },
  "backend": {
    "example_files": [
      "backend-dev.hcl.example",
      "backend-test.hcl.example",
      "backend-prod.hcl.example"
    ],
    "init_metadata_paths": ["starter/.terraform"],
    "real_init_opt_in": true
  },
  "editable_paths": ["starter/main.tf"],
  "protected_paths": [
    ".gitignore",
    "lab.yaml",
    "starter/variables.tf",
    "starter/versions.tf",
    "backend-dev.hcl.example",
    "backend-test.hcl.example",
    "backend-prod.hcl.example",
    "tests",
    "scripts/verify_backend.py"
  ]
}
